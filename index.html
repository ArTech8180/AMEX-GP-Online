#df button{background:#333;padding:10px 18px;margin:0 3px}#df button.on{background:var(--red)}[hidden]{display:none!important}#vcb{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:60;background:var(--glass);border:1px solid #666;padding:9px 16px;font-size:12px;letter-spacing:.06em}#vcb.live{border-color:#2ecc40;color:#2ecc40}#mps{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:520px}#mps button{background:#333;padding:8px 12px;font-size:11px}#mps button.on{background:var(--red)}#mps button:disabled{opacity:.4}#mapn{font-size:13px}html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}input{-webkit-user-select:text;user-select:text}#rot{display:none;position:fixed;inset:0;z-index:50;background:#0b0d12;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px}@media(orientation:portrait){body.touch #rot{display:flex}}#tc{display:none}body.touch #tc{display:block}.tb{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:80px;height:80px;border-radius:50%;background:rgba(10,12,18,.55);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(4px)}.tb.on{background:rgba(225,6,0,.75)}#tL{left:max(16px,env(safe-area-inset-left))}#tR{left:calc(max(16px,env(safe-area-inset-left)) + 96px)}#tG{right:max(16px,env(safe-area-inset-right));width:92px;height:112px;border-radius:30px}#tB{right:calc(max(16px,env(safe-area-inset-right)) + 108px)}#tD,#tC,#tX{width:56px;height:40px;border-radius:12px;font-size:11px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 124px)}#tD{right:max(16px,env(safe-area-inset-right))}#tC{right:calc(max(16px,env(safe-area-inset-right)) + 66px)}#tX{right:calc(max(16px,env(safe-area-inset-right)) + 132px)}body.touch #br{right:auto;left:50%;transform:translateX(-50%);bot :root body.cp #gear{font-size:clamp(14px,3vmin,22px)}

:root body.cp #lb{top:calc(var(--m) + var(--st) + var(--ms)*.62 + 8px);font-size:clamp(9px,1.1vmin + 3px,11px)}
</style></head><body>
<canvas id="c"></canvas>
<div class="p" id="tl"><div id="pos">P– / 10</div><div id="lap">LAP 0 / 3</div><div id="tm">0:00.000</div><div id="tod"></div><div>LAST <b id="last">–</b> &nbsp; BEST <b id="best">–</b></div></div>

<div id="lights"><i></i><i></i><i></i><i></i><i></i></div>
<div id="fl"></div><div class="p" id="lb"></div><button id="vcb" style="display:none">🎤 JOIN VOICE</button><div id="tc"><div class="tb" id="tL">◀</div><div class="tb" id="tR">▶</div><div class="tb" id="tB">BRAKE</div><div class="tb" id="tG">GAS</div><div class="tb" id="tD">DRS</div><div class="tb" id="tC">CAM</div><div class="tb" id="tX">RESET</div></div><div id="rot">↻ Rotate your phone to landscape to race</div>
<div id="msg"><h1>APEX GP</h1><div>3 laps · 10 cars<br>W / ↑ throttle · S / ↓ brake · A D / ← → steer<br>Space: DRS on the straights · C: camera · R: reset to track</div><div id="df"><button data-d=".64">EASY</button><button data-d=".74">NORMAL</button><button data-d=".84">HARD</button></div><div id="step1"><div id="mapn"></div><div id="mps"></div><input id="nm" maxlength="14" placeholder="Your driver name" autocomplete="off"><div id="invite"></div><div><button id="mk">CREATE RACE LINK</button> <button id="jn" hidden>JOIN RACE</button> <button id="solo">SOLO VS BOTS</button> <button id="mt" style="background:#333">TOUCH: OFF</button></div></div><div id="step2" hidden><div>Send this link to your friends</div><input id="lnk" readonly><button id="cp">COPY LINK</button><div id="pls"></div><div id="net"></div><button id="start">START RACE</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),LAPS=3,N=800,HW=7.5;
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,1,.3,3500);
const TR=[null,[[0,-20],[0,300],[0,700],[0,1050],[-20,1150],[30,1230],[120,1290],[260,1330],[420,1330],[520,1260],[560,1140],[540,1020],[560,900],[600,780],[560,660],[560,500],[620,360],[600,220],[520,60],[400,-120],[280,-300],[150,-430],[10,-470],[-70,-400],[-40,-260],[0,-130]],[[0,-20],[0,200],[0,600],[40,700],[140,740],[200,820],[160,900],[60,930],[-20,1000],[-30,1100],[40,1180],[160,1200],[260,1150],[300,1050],[260,950],[300,850],[400,800],[500,840],[560,940],[640,1000],[740,980],[790,900],[760,800],[690,720],[690,620],[760,540],[780,440],[720,360],[620,330],[540,260],[530,160],[580,60],[560,-60],[470,-160],[340,-230],[200,-300],[80,-330],[-30,-290],[-50,-200],[-20,-110]],[[0,-20],[0,300],[0,700],[0,1000],[75,1225],[300,1320],[525,1225],[600,1000],[600,700],[600,300],[600,0],[525,-225],[300,-320],[75,-225],[10,-120]]],
TH=[{g:'#43762d',f:0xbcd0e2,s:'#2a66ad',h:'#9cc1e4',z:'#d3e2ee'},{g:'#6c8a3a',f:0xe2d9bb,s:'#3a76b8',h:'#e8dcae',z:'#eadfbd'},{g:'#55737a',f:0xa9bccd,s:'#1d4e86',h:'#a8c0d8',z:'#b7c9da'},{g:'#b49b5e',f:0xe8caa0,s:'#c2672a',h:'#f2c88f',z:'#f0d3ab'}],
trk=(()=>{const m=location.hash.match(/^#(?:map(\d)|race-(\d))/);let t=m?+(m[1]??m[2]):-1;if(t<0){try{t=+sessionStorage.getItem('apexMap')||0}catch(e){t=0}}return clamp(t|0,0,TR.length-1)})();
S.fog=new THREE.Fog(TH[trk].f,300,1700);
function rs(){document.body.classList.toggle('cp',document.body.classList.contains('touch')||innerWidth<820||innerHeight<520);R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,250));if(window.visualViewport)visualViewport.addEventListener('resize',rs);rs();
function tex(w,h,fn,rx=1,ry=1){const g=document.createElement('canvas');g.width=w;g.height=h;fn(g.getContext('2d'),w,h);const t=new THREE.CanvasTexture(g);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t}
function speck(x,w,h,base,n,a){x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){x.fillStyle=Math.random()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}}
// sky + light
const sky=new THREE.Mesh(new THREE.SphereGeometry(2800,16,16),new THREE.MeshBasicMaterial({fog:false,side:THREE.BackSide,map:tex(2,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,TH[trk].s);g.addColorStop(.5,TH[trk].h);g.addColorStop(.52,TH[trk].z);g.addColorStop(1,TH[trk].z);x.fillStyle=g;x.fillRect(0,0,w,h)})}));S.add(sky);
const hemi=new THREE.HemisphereLight(0xdcecff,0x4a5a30,.8);S.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1.15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:10,far:700});S.add(sun,sun.target);
// ground
const grass=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),new THREE.MeshLambertMaterial({map:tex(256,256,(x,w,h)=>speck(x,w,h,TH[trk].g,3000,.12),530,530)}));
grass.rotation.x=-Math.PI/2;grass.position.y=-.05;grass.receiveShadow=true;S.add(grass);
// track
const pts=TR[trk]||[[0,-20],[0,200],[0,600],[60,780],[220,850],[360,780],[400,640],[330,520],[400,400],[560,360],[700,440],[820,600],[960,640],[1080,520],[1060,320],[920,180],[740,120],[560,40],[420,-100],[260,-200],[100,-330],[-100,-330],[-170,-220],[-60,-120]];
const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])),true,'centripetal');
const L=curve.getLength(),ds=L/N,P=curve.getSpacedPoints(N),T=[],Nm=[],K=[];
for(let i=0;i<N;i++){const t=P[(i+1)%N].clone().sub(P[(i+N-1)%N]).setY(0).normalize();T.push(t);Nm.push(new THREE.Vector3(t.z,0,-t.x))}
for(let i=0;i<N;i++)K.push(Math.acos(clamp(T[(i+N-2)%N].dot(T[(i+2)%N]),-1,1))/(4*ds));
const prof=K.map(k=>Math.min(96,Math.sqrt(34/Math.max(k,1e-4))));
for(let p=0;p<3;p++){for(let i=N-1;i>=0;i--){const j=(i+1)%N;prof[i]=Math.min(prof[i],Math.sqrt(prof[j]**2+2*38*ds))}for(let i=0;i<N;i++){const j=(i+1)%N;prof[j]=Math.min(prof[j],Math.sqrt(prof[i]**2+2*9*ds))}}
function ribbon(o1,o2,y,vs,mat,col){const pos=[],uv=[],idx=[],cl=[];for(let i=0;i<=N;i++){const k=i%N,p=P[k],n=Nm[k];pos.push(p.x+n.x*o1,y,p.z+n.z*o1,p.x+n.x*o2,y,p.z+n.z*o2);uv.push(0,i*ds/vs,1,i*ds/vs);if(col){const c=col(k);cl.push(...c,...c)}if(i<N){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));if(col)g.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.receiveShadow=true;S.add(m)}
const dbl=THREE.DoubleSide;
ribbon(-HW,HW,.02,22,new THREE.MeshStandardMaterial({roughness:.92,side:dbl,map:tex(256,256,(x,w,h)=>{speck(x,w,h,'#3b3c41',6000,.07);const g=x.createLinearGradient(0,0,w,0);g.addColorStop(.3,'rgba(0,0,0,0)');g.addColorStop(.5,'rgba(0,0,0,.2)');g.addColorStop(.7,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#e8e8e8';x.fillRect(6,0,5,h);x.fillRect(w-11,0,5,h)})}));
const kc=k=>K[k]<.003?[.22,.22,.24]:(Math.floor(k/3)%2?[.85,.05,.04]:[.95,.95,.95]);
const km=new THREE.MeshLambertMaterial({vertexColors:true,side:dbl});
ribbon(HW,HW+1.5,.03,1,km,kc);ribbon(-HW-1.5,-HW,.03,1,km,kc);
const gv=new THREE.MeshLambertMaterial({side:dbl,map:tex(128,128,(x,w,h)=>speck(x,w,h,'#b6a57f',1500,.15),1,1)});
ribbon(HW+1.5,HW+9.5,.01,8,gv);ribbon(-HW-9.5,-HW-1.5,.01,8,gv);
// scenery
const D=new THREE.Object3D(),C=new THREE.Color();
const bar=new THREE.InstancedMesh(new THREE.BoxGeometry(.8,1.1,ds*1.04),new THREE.MeshLambertMaterial(),N*2);
for(let i=0;i<N;i++)for(const sd of[-1,1]){const k=i*2+(sd>0?1:0),o=sd*(HW+10.8);D.position.set(P[i].x+Nm[i].x*o,.55,P[i].z+Nm[i].z*o);D.rotation.y=Math.atan2(T[i].x,T[i].z);D.updateMatrix();bar.setMatrixAt(k,D.matrix);bar.setColorAt(k,C.set(Math.floor(i/2)%2?0xdd1111:0xf2f2f2))}
S.add(bar);
const tc=new THREE.InstancedMesh(new THREE.ConeGeometry(3,9,7),new THREE.MeshLambertMaterial({color:0x2d5a27}),600),tt=new THREE.InstancedMesh(new THREE.CylinderGeometry(.4,.5,3,6),new THREE.MeshLambertMaterial({color:0x4a3524}),600);
let tn=0;D.rotation.set(0,0,0);

function aiStepOld(dt){const obs=[...ais,{s:pl.prog*ds,off:pl.d,v:pl.vf,pl:1}];

function crash(c,rel){if(c.mode!=='race')return;c.mode='spin';c.dr=(Math.random()<.5?-1:1)*(2+Math.random()*3);c.hs=(Math.random()<.5?-1:1)*(5+Math.random()*4);c.hoff=0;c.t=0;c.dnf=Math.random()<.3;say('⚠ INCIDENT ON TRACK',1400)}
function aiStep(dt){const go=st==='race'||st==='done',obs=[...ais,{s:pl.prog*ds,off:pl.d,v:pl.vf,mode:'race',pl:1}];
for(const a of ais){const po=a.off;

else if(a.mode==='wreck'){a.t+=dt;if(!a.dnf&&a.t>7){a.mode='race';a.hoff=0;a.dodge=0}}
else{const i=((Math.floor(a.s/ds)%N)+N)%N,j=(i+35)%N,sg=Math.sign(T[i].z*T[j].x-T[i].x*T[j].z),kA=Math.max(K[(i+15)%N],K[(i+30)%N],K[(i+45)%N]),w0=clamp(K[i]/.01,0,1),we=clamp(kA/.01,0,1)*(1-w0),line=sg*(w0*4-we*3.2);

for(const o of obs){if(o===a)continue;const g=(((o.s-a.s+L/2)%L)+L)%L-L/2,dof=o.off-a.off,bad=o.mode!=='race';
if(g>0&&g<(bad?110:28)&&Math.abs(dof)<(bad?3.6:3)){near=1;if(a.dT<=0){a.dodge=(a.off>=o.off?1:-1)*3.8;a.dT=2.2}

const q=at(a.s,a.off),dr=(a.off-po)/Math.max(dt,.001);a.m.position.set(q.x,0,q.z);a.m.rotation.y=q.h+a.hoff+(a.mode==='race'?Math.atan2(dr,Math.max(a.v,8)):0);a.m.rotation.z=a.mode==='spin'?Math.sin(a.hoff*2)*.1:0;spin(a.m,a.v,0,dt)}}
function spin(m,v,st,dt){for(const w of m.userData.wh){w.sp.rotation.x+=v*dt/w.r;if(w.f)w.pv.rotation.y=st*.35}}
// frame
let last=performance.now();

if(st==='lights'){lt+=dt;const n=Math.min(5,Math.floor(lt/.9));document.querySelectorAll('#lights i').forEach((e,i)=>e.classList.toggle('on',i<n));lm.forEach((m,i)=>m.color.set(i<n?0xff1a1a:0x330000));
